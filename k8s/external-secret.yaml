apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warehouse-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: warehouse-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: DB_PASSWORD

    - secretKey: JWT_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: JWT_TOKEN
    # Per-pair RS256 principal for the warehouse-microservice -> orders-microservice
    # lane (notifyOrdersStatus). Its own Vault property, NOT JWT_TOKEN — that
    # property is the shared a2880693 value.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: WAREHOUSE_MAINTENANCE_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: WAREHOUSE_MAINTENANCE_TOKEN
    - secretKey: CLIPLOT_WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/cliplot
        property: WAREHOUSE_SERVICE_TOKEN

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: warehouse-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: warehouse-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: DATABASE_URL
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: DB_PASSWORD

    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    # lane (notifyOrdersStatus). Its own Vault property, NOT JWT_TOKEN — that
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: ORDERS_SERVICE_TOKEN
    - secretKey: WAREHOUSE_MAINTENANCE_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: WAREHOUSE_MAINTENANCE_TOKEN
    # S2S: auth-microservice/docs/SERVICE_IDENTITY_CONSUMER_STANDARD.md
    - secretKey: LOGGING_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/warehouse-microservice
        property: LOGGING_SERVICE_TOKEN
